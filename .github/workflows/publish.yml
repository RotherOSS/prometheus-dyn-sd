
name: Build and Deploy to GHCR

on:
  push:
      branches: [ main ]
  pull_request:
    branches: [ main ]


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVICE_NAME: prometheus-dyn-sd
  GHCR_USER: splayfery
  TAGS: latest

jobs:
  build-and-publish:

    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
       
    - name: Set up Coretto 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'corretto'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Setup Gradle (Latest)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: current

    - name: Build with Gradle
      run: gradle build --parallel --no-daemon --configuration-cache

    - name: Set up QEMU (for ARM emulation)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        install: true
        driver: docker-container

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup old latest images in GHCR
      uses: actions/delete-package-versions@v5
      continue-on-error: true
      with:
        package-name: ${{ env.SERVICE_NAME }}
        package-type: container
        min-versions-to-keep: 1

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: ${{ env.TAGS }}

    - name: Build and push multi-arch Docker image
      id: push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
